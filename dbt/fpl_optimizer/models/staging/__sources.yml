version: 2
sources:
  - name: fpl_raw
    database: "{{ env_var('GOOGLE_CLOUD_PROJECT', 'fpl-optimizer-511321') }}"
    schema: "{{ env_var('FPL_RAW_DATASET', 'fpl_raw') }}"
    description: Captured FPL API inputs. Current catalogs are replaced; fixture history is merged by season.
    tables:
      - name: players
        config:
          loaded_at_field: CAST(ingested_at AS TIMESTAMP)
          freshness:
            warn_after: {count: 8, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: run_id
            data_tests: [not_null]
      - name: teams
        config:
          loaded_at_field: CAST(ingested_at AS TIMESTAMP)
          freshness:
            warn_after: {count: 8, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: run_id
            data_tests: [not_null]
      - name: positions
        config:
          loaded_at_field: CAST(ingested_at AS TIMESTAMP)
          freshness:
            warn_after: {count: 8, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: run_id
            data_tests: [not_null]
      - name: gameweeks
        config:
          loaded_at_field: CAST(ingested_at AS TIMESTAMP)
          freshness:
            warn_after: {count: 8, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: run_id
            data_tests: [not_null]
      - name: fixtures
        config:
          loaded_at_field: CAST(ingested_at AS TIMESTAMP)
          freshness:
            warn_after: {count: 8, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: run_id
            data_tests: [not_null]
      - name: player_fixture_history
        description: One current observation per (season, player_id, fixture_id); optional metrics may be null.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, player_id, fixture_id]
        columns:
          - name: season
            data_tests: [not_null]
          - name: player_id
            data_tests: [not_null]
          - name: fixture_id
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
          - name: payload_hash
            data_tests: [not_null]
      - name: player_history_checks
        description: Successful full-response checks, including empty histories. Freshness is independent of changed rows.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, player_id]
        columns:
          - name: checked_at
            data_tests: [not_null]
      - name: pipeline_runs
        columns:
          - name: run_id
            data_tests: [not_null, unique]
          - name: checked_at
            data_tests: [not_null]
          - name: season
            data_tests: [not_null]

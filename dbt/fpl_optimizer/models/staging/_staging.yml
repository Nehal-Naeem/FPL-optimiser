version: 2
models:
  - name: stg_players
    columns:
      - name: id
        data_tests: [not_null, unique]
      - name: team
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_teams')", field: id}
      - name: element_type
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_positions')", field: id}
      - name: now_cost
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: '> 0'}
      - name: minutes
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: '>= 0'}
  - name: stg_fixtures
    columns:
      - name: id
        data_tests: [not_null, unique]
      - name: team_h
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_teams')", field: id}
      - name: team_a
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_teams')", field: id}
      - name: event
        data_tests:
          - relationships:
              arguments: {to: "ref('stg_gameweeks')", field: id}
  - name: stg_player_fixture_history
    description: Current-season typed fixture observations, deduplicated by latest observation and run ID.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, player_id, fixture_id]}
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: fixture_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_fixtures')", field: id}
      - name: gameweek
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: 'between 1 and 38'}
      - name: minutes
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: 'between 0 and 90'}
      - name: starts
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1], quote: false}
      - name: total_points
        data_tests: [not_null]
      - name: expected_goals
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: '>= 0'}
      - name: expected_assists
        data_tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: '>= 0'}
      - name: season
        data_tests: [not_null]
      - name: run_id
        data_tests: [not_null]
      - name: ingested_at
        data_tests: [not_null]
      - name: was_home
        data_tests: [not_null]
      - name: opponent_team
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_teams')", field: id}
      - name: goals_scored
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: '>= 0'}
      - name: assists
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: '>= 0'}
  - name: stg_gameweeks
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
          - dbt_utils.expression_is_true:
              arguments: {expression: 'between 1 and 38'}

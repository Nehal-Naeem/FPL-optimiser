name: fpl_optimizer

profile: fpl_optimizer

query-comment:
  comment: "{{ tojson({'application': 'fpl_optimizer', 'fpl_run': env_var('FPL_RUN_ID', 'local_validation')}) }}"
  job-label: true

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Sample Jaffle Shop CSVs remain available for recovery, but are not FPL inputs.
  fpl_optimizer:
    +enabled: false

models:
  fpl_optimizer:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

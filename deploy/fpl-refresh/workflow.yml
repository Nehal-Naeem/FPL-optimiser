# Lock acquisition is transactional. Failed/ambiguous executions retain ownership for operator recovery.
main:
  steps:
    - init:
        assign:
          - ingestion: null
          - dbt: null
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - run_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - control: ${"`" + project + "." + sys.get_env("RAW_DATASET") + ".refresh_control`"}
    - acquire:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference:
              projectId: ${project}
              location: ${sys.get_env("BIGQUERY_LOCATION")}
              jobId: ${"fpl_acquire_" + run_id}
            configuration:
              labels:
                fpl_run: ${run_id}
              query:
                useLegacySql: false
                maximumBytesBilled: "100000000"
                query: ${"BEGIN TRANSACTION; ASSERT (SELECT COUNT(*)=1 FROM " + control + " WHERE lock_id='refresh') AS 'Invalid lock singleton'; UPDATE " + control + " SET owner=@owner, acquired_at=CURRENT_TIMESTAMP(), ingestion_execution=NULL WHERE lock_id='refresh' AND owner IS NULL; ASSERT @@row_count=1 AS 'Another refresh owns the lock'; COMMIT TRANSACTION;"}
                parameterMode: NAMED
                queryParameters:
                  - name: owner
                    parameterType: {type: STRING}
                    parameterValue: {value: '${run_id}'}
          connector_params:
            timeout: 180
    - refresh:
        try:
          steps:
            - ingest:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + project + "/locations/" + sys.get_env("JOB_REGION") + "/jobs/" + sys.get_env("INGESTION_JOB")}
                  body:
                    overrides:
                      containerOverrides:
                        - env:
                            - name: FPL_RUN_ID
                              value: ${run_id}
                  connector_params:
                    timeout: 3900
                result: ingestion
            - build:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + project + "/locations/" + sys.get_env("JOB_REGION") + "/jobs/" + sys.get_env("DBT_JOB")}
                  body:
                    overrides:
                      containerOverrides:
                        - env:
                            - name: FPL_RUN_ID
                              value: ${run_id}
                  connector_params:
                    timeout: 1500
                result: dbt
        except:
          as: error
          steps:
            - log_failure:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    run_id: ${run_id}
                    message: Refresh failed; lock retained. Verify jobs are idle before operator unlock.
                    error: ${error}
            - fail:
                raise: ${error}
    - release:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference:
              projectId: ${project}
              location: ${sys.get_env("BIGQUERY_LOCATION")}
              jobId: ${"fpl_release_" + run_id}
            configuration:
              labels:
                fpl_run: ${run_id}
              query:
                useLegacySql: false
                maximumBytesBilled: "100000000"
                query: ${"UPDATE " + control + " SET owner=NULL, acquired_at=NULL WHERE lock_id='refresh' AND owner=@owner; ASSERT @@row_count=1 AS 'Lost refresh lock';"}
                parameterMode: NAMED
                queryParameters:
                  - name: owner
                    parameterType: {type: STRING}
                    parameterValue: {value: '${run_id}'}
          connector_params:
            timeout: 180
    - log_success:
        call: sys.log
        args:
          severity: INFO
          json:
            message: FPL refresh succeeded
            run_id: ${run_id}
    - complete:
        return:
          run_id: ${run_id}
          ingestion_execution: ${ingestion.response.name}
          dbt_execution: ${dbt.response.name}
